[project]
name = "3d-ultrasound-diffusion"
version = "0.1.0"
description = "High Volume Rate 3D Ultrasound Reconstruction with Diffusion Models"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "zea>=0.1.9,<0.2",
    "jax[cuda12]>=0.4.35; sys_platform == 'linux'",
    "jax>=0.4.35; sys_platform != 'linux'",
    "huggingface-hub>=0.26",
    "imageio[ffmpeg]>=2.0",
    "matplotlib>=3.10",
    "numpy>=1.24",
    "opencv-python-headless>=4",
    "pillow>=10",
    "pyyaml>=6",
    "scipy>=1.13",
    "tqdm>=4",
    "tyro>=1.0",
]

[project.optional-dependencies]
# Hyperparameter search (optimize_diffusion.py)
tuning = ["optuna>=4"]

[dependency-groups]
dev = ["ruff>=0.6"]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["temp"]

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501", "E402"]

[tool.ruff.lint.isort]
known-third-party = ["zea"]
